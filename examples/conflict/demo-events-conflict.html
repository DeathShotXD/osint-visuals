  side.append(t);
  if (D.countries.length) {
    const h2 = document.createElement("h2"); h2.style.marginTop = "12px"; h2.textContent = "By country"; side.append(h2);
    const t2 = document.createElement("table");
    for (const c of D.countries) { const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = c.country;
      const b = document.createElement("td"); b.textContent = num(c.events); tr.append(a, b); t2.append(tr); }
    side.append(t2);
  }
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "Reported events, aggregated. Reporting is uneven across places and dates, and a report is not a verified fact. No individual or victim is identified.";
  side.append(hint);

  $("chart").replaceChildren(svg);
  buildTable();
}

function detail(e) {
  const side = $("side"); side.replaceChildren();
  const h = document.createElement("h2"); h.textContent = e.month; side.append(h);
  const p = document.createElement("div"); p.style.fontSize = "12.5px";
  p.textContent = `${num(e.deaths)} reported deaths` + (e.country ? ` - ${e.country}` : "") +
    (e.type ? ` - ${D.types.find(t => t.key === e.type) ? D.types.find(t => t.key === e.type).label : e.type}` : "");
  const s = document.createElement("div"); s.className = "hint"; s.textContent = e.source || "No source line in the row.";
  const back = document.createElement("button"); back.textContent = "Back to summary";
  back.onclick = draw;
  side.append(p, s, back);
}

function buildTable() {
  const t = document.createElement("table"); t.className = "big";
  const head = document.createElement("tr");
  for (const h of ["Month", "Latitude", "Longitude", "Reported deaths", "Type", "Country", "Source"]) {
    const th = document.createElement("th"); th.textContent = h; head.append(th);
  }
  t.append(head);
  for (const e of D.events.slice(0, 2000)) {
    const tr = document.createElement("tr");
    for (const v of [e.month, e.lat, e.lon, e.deaths, e.type, e.country, (e.source || "").slice(0, 100)]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    t.append(tr);
  }
  $("table").replaceChildren(t);
}

$("foot").textContent = `${D.source ? "Source: " + D.source + ". " : "Source not stated. "}` +
  `Generated ${D.generated} from ${D.input}. Event tables record reports, not verified facts; check definitions, ` +
  `coverage and double counting before publishing. No victim names. Made with osint-visuals.`;
draw();
</script>
</body></html>
