  map.addLayer({ id: "dot", type: "circle", source: "marks", filter: ["==", ["get", "k"], "dot"], paint: { "circle-radius": ["get", "r"], "circle-color": ["get", "c"], "circle-stroke-color": "#000", "circle-stroke-width": 1.5, "circle-opacity": ["get", "o"] } });
  layout(); seek(T0);
});
map.on("render", () => drawOverlay());

// ------------------------------------------------------------------ where everything is at time t
function idx(pts, tt) { let lo = 0, hi = pts.length - 1; if (tt < pts[0][0]) return -1; if (tt >= pts[hi][0]) return hi;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m][0] <= tt) lo = m; else hi = m; } return lo; }
function state(tr, tt) {   // {path, head, dark}: dark = inside a signal gap (head stays at the last report)
  const pts = tr.pts, i = idx(pts, tt); if (i < 0) return { path: [], head: null, dark: false, before: true };
  const path = pts.slice(0, i + 1).map(p => [p[2], p[1]]);
  if (i === pts.length - 1) return { path, head: path[path.length - 1], dark: false, done: true };
  const a = pts[i], b = pts[i + 1], span = b[0] - a[0];
  if (span > D.gap_hours * 3600) return { path, head: [a[2], a[1]], dark: true };
  const k = (tt - a[0]) / span, h = [a[2] + (b[2] - a[2]) * k, a[1] + (b[1] - a[1]) * k]; path.push(h); return { path, head: h, dark: false };
}
function seek(tt) {
  t = Math.max(T0, Math.min(T1, tt)); if (!map.isStyleLoaded()) return;
  const marks = [];
  D.tracks.forEach((tr, i) => { const st = state(tr, t); tr._st = st;
    map.getSource("prog" + i).setData(st.path.length > 1 ? line(st.path) : empty());
    if (st.head) marks.push(pt(st.head, { k: st.dark ? "ring" : "dot", c: st.dark ? C.gap : tr.colour, r: st.dark ? 9 + 3 * Math.sin(performance.now() / 180) : 6, o: 1 })); });
  map.getSource("gaps").setData({ type: "FeatureCollection", features: GAPS.filter(g => t >= g.t0).map(g => line([[g.a[1], g.a[0]], [g.b[1], g.b[0]]], { o: t >= g.t1 ? 0.95 : 0.45 })) });
  MEETS.filter(m => t >= m.t0).forEach(m => marks.push(pt([m.at[1], m.at[0]], { k: "ring", c: C.meet, r: 16, o: 0.9 })));
  JUMPS.filter(j => t >= j.t).forEach(j => marks.push(pt([j.b[1], j.b[0]], { k: "ring", c: C.jump, r: 11, o: 0.95 })));
  map.getSource("marks").setData({ type: "FeatureCollection", features: marks });
  $("scrub").value = Math.round((t - T0) / (T1 - T0 || 1) * 1000); const c = clock(t); $("tlabel").textContent = `${c.date} ${c.time} ${c.zone}`;
  map.triggerRepaint();
}
const pt = (c, props) => ({ type: "Feature", properties: props, geometry: { type: "Point", coordinates: c } });

// ------------------------------------------------------------------ the overlay: title, clock, callouts, legend, sources
const ov = $("ov"), g = ov.getContext("2d");
function font(w, px) { return `${w} ${Math.round(px * u)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; }
function box(x, y, w, h, r, fill, stroke) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5 * u; g.stroke(); } }
function wrap(text, maxW) { const words = String(text).split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const test = cur ? cur + " " + w : w; if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; } if (cur) lines.push(cur); return lines; }
let boxes = [];   // label boxes placed this frame, so later ones can avoid them
function callout(lngLat, lines, colour, side) {   // a labelled box joined to a point on the map, placed where it fits
  const p = map.project(lngLat), x = p.x * S, y = p.y * S; if (x < -50 || y < -50 || x > outW + 50 || y > outH + 50) return;
  const w = Math.max(...lines.map((l, i) => { g.font = font(i ? 500 : 700, i ? 19 : 22); return g.measureText(l).width; })) + 28 * u;
  const h = (22 + 26 * (lines.length - 1) + 22) * u, m = 16 * u, off = 34 * u;
  const tries = [[side, -1], [-side, -1], [side, 1], [-side, 1], [side, -2.4], [-side, -2.4], [side, 2.4], [-side, 2.4]].map(([sx, sy]) => {
    let bx = sx > 0 ? x + off : x - off - w, by = sy < 0 ? y + sy * (h / 2) - h / 2 - 14 * u : y + sy * (h / 2) - h / 2 + 14 * u;
    bx = Math.max(m, Math.min(outW - w - m, bx)); by = Math.max(m, Math.min(outH - h - 120 * u, by)); return [bx, by]; });
  const hit = (bx, by) => boxes.some(r => bx < r[0] + r[2] + 8 * u && bx + w + 8 * u > r[0] && by < r[1] + r[3] + 8 * u && by + h + 8 * u > r[1]);
  const [bx, by] = tries.find(([bx, by]) => !hit(bx, by)) || tries[0]; boxes.push([bx, by, w, h]);
  const ax = Math.max(bx, Math.min(bx + w, x)), ay = y < by ? by : by + h;
  g.strokeStyle = colour; g.lineWidth = 2 * u; g.beginPath(); g.moveTo(x, y); g.lineTo(ax, ay); g.stroke();
  box(bx, by, w, h, 10 * u, "rgba(10,13,16,.9)", colour);
  lines.forEach((l, i) => { g.font = font(i ? 500 : 700, i ? 19 : 22); g.fillStyle = i ? "#c9d3cf" : colour; g.fillText(l, bx + 14 * u, by + (30 + 26 * i) * u); });
}
const hrs = h => h >= 48 ? `${Math.round(h / 24 * 10) / 10} days` : `${h} h`;
function legendItems() { return D.tracks.map(tr => [tr.colour, tr.id, "solid"]).concat(GAPS.length ? [[C.gap, `No signal > ${D.gap_hours} h`, "dash"]] : [],
  MEETS.length ? [[C.meet, "Side by side", "ring"]] : [], JUMPS.length ? [[C.jump, "Position out of line", "ring"]] : []); }
function legendWidth() { g.font = font(600, 18); const w = Math.max(...legendItems().map(l => g.measureText(l[1]).width)) + 70 * u; return outW > 2.4 * w ? w : 0; }
function drawOverlay() {
  if (!outW) return; g.clearRect(0, 0, outW, outH); const pad = 36 * u;
  // gradient so the text reads over any map
  let gr = g.createLinearGradient(0, 0, 0, 260 * u); gr.addColorStop(0, "rgba(5,7,9,.85)"); gr.addColorStop(1, "rgba(5,7,9,0)"); g.fillStyle = gr; g.fillRect(0, 0, outW, 260 * u);
  gr = g.createLinearGradient(0, outH - 300 * u, 0, outH); gr.addColorStop(0, "rgba(5,7,9,0)"); gr.addColorStop(1, "rgba(5,7,9,.9)"); g.fillStyle = gr; g.fillRect(0, outH - 300 * u, outW, 300 * u);
  // title
  g.textBaseline = "alphabetic"; g.fillStyle = "#5bbf4b"; g.font = font(800, 18); g.fillText((D.kind === "aircraft" ? "FLIGHT TRACK" : "VESSEL TRACK") + (D.tracks.length > 1 ? ` · ${D.tracks.length} TRACKS` : ""), pad, pad + 14 * u);
  const legW = legendWidth(); g.fillStyle = "#fff"; g.font = font(800, 44); const tl = wrap(D.title, outW - 2 * pad - (legW ? legW + 24 * u : 0)); tl.slice(0, 2).forEach((l, i) => g.fillText(l, pad, pad + (64 + 50 * i) * u));
  if (D.subtitle) { g.fillStyle = "#c9d3cf"; g.font = font(500, 22); g.fillText(D.subtitle, pad, pad + (64 + 50 * Math.min(2, tl.length) - 10) * u + 22 * u); }
  // callouts
  const placed = []; boxes = [[0, 0, outW, 0]];
  D.tracks.forEach(tr => { const st = tr._st; if (!st || !st.head) return;
    if (st.dark) { const gp = GAPS.find(x => x.track === tr.id && t >= x.t0 && t < x.t1); if (gp) { const c0 = clock(gp.t0);
      callout(st.head, [`${tr.id}: signal lost`, `Last report ${c0.time} ${c0.zone} · dark ${hrs(Math.round((t - gp.t0) / 360) / 10)}`], C.gap, 1); } }
    else if (D.tracks.length > 1 || !st.done) { const p = map.project(st.head); g.font = font(700, 20); const tw = g.measureText(tr.id).width;
      const x = p.x * S + 14 * u + tw > outW - 16 * u ? p.x * S - 14 * u - tw : p.x * S + 14 * u; let y = p.y * S - 12 * u;
      while (placed.some(q => Math.abs(q[0] - x) < 160 * u && Math.abs(q[1] - y) < 24 * u)) y += 26 * u;   // ships side by side: stack the names
      placed.push([x, y]); g.font = font(700, 20); g.lineWidth = 4 * u; g.strokeStyle = "rgba(0,0,0,.75)"; g.strokeText(tr.id, x, y); g.fillStyle = tr.colour; g.fillText(tr.id, x, y); } });
  GAPS.filter(x => t >= x.t1).forEach(x => callout([(x.a[1] + x.b[1]) / 2, (x.a[0] + x.b[0]) / 2], [`${x.track}: no signal for ${hrs(x.hours)}`,
    ...x.near.map(n => `${n.track} ${n.km} km away when it ${n.when}`).slice(0, 2), `${x.km} km between last and next report`], C.gap, -1));
  MEETS.filter(m => t >= m.t0).forEach(m => callout([m.at[1], m.at[0]], [`Side by side: ${m.tracks.join(" + ")}`, `within ${m.min_km < 1 ? Math.round(m.min_km * 1000) + " m" : m.min_km + " km"} for ${hrs(m.hours)}`], C.meet, 1));
  JUMPS.filter(j => t >= j.t).forEach(j => callout([j.b[1], j.b[0]], [j.outlier ? `Position out of line: ${j.knots} kn` : `Impossible jump: ${j.knots} kn`, `${j.track} · spoofed or a bad fix?`], C.jump, -1));
  // clock
  const c = clock(t); g.fillStyle = "#fff"; g.font = font(800, 54); g.fillText(c.time, pad, outH - pad - 92 * u);
  g.font = font(600, 22); g.fillStyle = "#c9d3cf"; g.fillText(`${c.date} · ${c.zone}`, pad + g.measureText("").width, outH - pad - 60 * u);
  // timeline bar with the gaps marked
  const bx = pad, bw = outW - 2 * pad, by = outH - pad - 40 * u, k = x => bx + (x - T0) / (T1 - T0 || 1) * bw;
  box(bx, by, bw, 6 * u, 3 * u, "rgba(255,255,255,.18)"); box(bx, by, Math.max(0, k(t) - bx), 6 * u, 3 * u, "#5bbf4b");
  GAPS.forEach(x => box(k(x.t0), by - 2 * u, Math.max(3 * u, k(x.t1) - k(x.t0)), 10 * u, 2 * u, C.gap));
  // legend (top right) and sources (bottom)
  const leg = legendItems();
  g.font = font(600, 18); const lw = legW, lh = (16 + 28 * leg.length) * u;
  if (lw) { const lx = outW - pad - lw, ly = pad; box(lx, ly, lw, lh, 10 * u, "rgba(10,13,16,.8)", "rgba(255,255,255,.12)");
    leg.forEach(([col, label, kind], i) => { const yy = ly + (30 + 28 * i) * u; g.strokeStyle = col; g.lineWidth = 3 * u; g.setLineDash(kind === "dash" ? [6 * u, 5 * u] : []);
      if (kind === "ring") { g.beginPath(); g.arc(lx + 30 * u, yy - 6 * u, 7 * u, 0, 7); g.stroke(); } else { g.beginPath(); g.moveTo(lx + 16 * u, yy - 6 * u); g.lineTo(lx + 44 * u, yy - 6 * u); g.stroke(); }
      g.setLineDash([]); g.fillStyle = "#dfe6e3"; g.fillText(label, lx + 56 * u, yy); }); }
  g.font = font(500, 15); g.fillStyle = "rgba(220,228,225,.75)";
  const src = `Positions: ${D.source || "source not stated"}. Map © OpenStreetMap contributors, OpenMapTiles, OpenFreeMap. Made with osint-visuals.`;
  wrap(src, outW - 2 * pad).slice(0, 2).reverse().forEach((l, i) => g.fillText(l, pad, outH - 16 * u - i * 20 * u));
  if (recording) recording.paint();
}

// ------------------------------------------------------------------ frame size, playback, export
function layout() {
  const W = innerWidth, H = innerHeight - 64, f = FMT[fmt]; let cw, ch;
  if (!f) { cw = W; ch = H; } else { const s = Math.min(W / f[0], H / f[1]); cw = Math.floor(f[0] * s); ch = Math.floor(f[1] * s); }
  $("stage").style.width = cw + "px"; $("stage").style.height = ch + "px";
  outW = f ? f[0] : Math.round(cw * devicePixelRatio); outH = f ? f[1] : Math.round(ch * devicePixelRatio); S = outW / cw; u = Math.min(outW, outH) / 1000;
  ov.width = outW; ov.height = outH; ov.style.width = cw + "px"; ov.style.height = ch + "px";
  map.resize(); map.setPixelRatio(S);
  map.fitBounds(D.bounds, { padding: { top: (f ? 250 : 200) / S * u, bottom: 230 / S * u, left: 60 / S * u, right: 60 / S * u }, maxZoom: 13, animate: false });
  map.triggerRepaint();
}
function frame(now) { const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
  if (playing) { const len = +$("speed").value; seek(t + dt * (T1 - T0) / len); if (t >= T1) { playing = false; $("play").textContent = "▶ Play"; recording?.finish(); } }
  else if (D.tracks.some(tr => tr._st?.dark)) seek(t);   // keep the "signal lost" ring pulsing
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
$("play").onclick = () => { if (t >= T1) seek(T0); playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Play"; };
$("scrub").oninput = e => { playing = false; $("play").textContent = "▶ Play"; seek(T0 + (T1 - T0) * e.target.value / 1000); };
$("fmt").onchange = e => { fmt = e.target.value; layout(); seek(t); };
addEventListener("resize", () => { layout(); seek(t); });
function compose() { const c = document.createElement("canvas"); c.width = outW; c.height = outH; const x = c.getContext("2d");
  x.drawImage(map.getCanvas(), 0, 0, outW, outH); x.drawImage(ov, 0, 0); return c; }
const slug = () => (D.title || "track").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
function save(blob, ext) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("png").onclick = () => { map.once("render", () => compose().toBlob(b => save(b, "png"))); map.triggerRepaint(); };
$("rec").onclick = () => {
  if (recording) return; const c = document.createElement("canvas"); c.width = outW; c.height = outH; const x = c.getContext("2d");
  const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 }), parts = [];
  rec.ondataavailable = e => parts.push(e.data); rec.onstop = () => { save(new Blob(parts, { type: "video/webm" }), "webm"); recording = null; $("rec").textContent = "● Record"; };
  recording = { paint: () => { x.drawImage(map.getCanvas(), 0, 0, outW, outH); x.drawImage(ov, 0, 0); },
    finish: () => setTimeout(() => rec.stop(), 1500) };
  $("rec").textContent = "Recording…"; seek(T0); recording.paint(); rec.start(); setTimeout(() => { playing = true; $("play").textContent = "❚❚ Pause"; }, 600);
};
// for automated renders: ?t=0.0-1.0 jumps to that point; ?fmt=9:16 picks a frame
const q = new URLSearchParams(location.search); if (q.get("fmt") && FMT[q.get("fmt")] !== undefined) { fmt = q.get("fmt"); $("fmt").value = fmt; }
if (q.has("t")) map.once("idle", () => seek(T0 + (T1 - T0) * +q.get("t")));
</script>
