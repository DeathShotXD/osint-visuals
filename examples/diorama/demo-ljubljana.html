named.filter(n => !busy.some(([x, z]) => Math.hypot(n.x - x, n.z - z) < 28)).sort((a, b) => b.area - a.area).slice(0, 4).forEach(n => label(n.n.length > 34 ? n.n.slice(0, 32) + "…" : n.n, "#ffffff", new THREE.Vector3(n.x, n.y + 6, n.z), false));

// ------------------------------------------------------------------ cameras and views
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -R * 10, R * 10), persp = new THREE.PerspectiveCamera(50, 1, 0.5, R * 8);
let cam = ortho, view = "iso", outW = 0, outH = 0, S = 1, u = 1, fmt = "screen", spin = false, recording = null;
const controls = new OrbitControls(ortho, ov); controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.15; ov.style.pointerEvents = "auto";
function setView(v) { view = v; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  around.forEach(m => m.visible = v !== "eye");
  evidence.visible = true; labels.forEach(l => l.visible = true);
  camMarker.visible = v !== "eye"; if (camLabel) camLabel.visible = v !== "eye";
  if (v === "eye" && camPos) { cam = persp; controls.enabled = false;
    persp.position.copy(camPos); persp.lookAt(EV.target ? new THREE.Vector3(EV.target.x, 1.6, EV.target.z) : camLook); fitCam(); return; }
  cam = ortho; controls.enabled = true; controls.object = ortho;
  if (v === "top") ortho.position.set(0, R * 4, 0.001); else ortho.position.set(R * 1.6, R * 1.9, R * 2.2);
  ortho.up.set(0, 1, 0); controls.target.set(0, 0, 0); ortho.lookAt(0, 0, 0); fitCam(); controls.update(); }
function fitCam() { const a = outW / outH || 1, span = R * (view === "top" ? 1.25 : a >= 1 ? 1.55 : 1.62 / Math.min(1, a * 1.12));   // tall frames: the turned model is wider than it is high
  if (a >= 1) Object.assign(ortho, { left: -span * a, right: span * a, top: span, bottom: -span }); else Object.assign(ortho, { left: -span, right: span, top: span / a, bottom: -span / a });
  ortho.zoom = view === "top" ? 1 : 1.05; ortho.updateProjectionMatrix();
  if (EV.camera) persp.fov = 2 * Math.atan(Math.tan(EV.camera.fov * Math.PI / 360) / a) * 180 / Math.PI; persp.aspect = a; persp.updateProjectionMatrix(); }
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view)); if (!camPos) document.querySelector('[data-view="eye"]').disabled = true;
$("spin").onclick = () => { spin = !spin; $("spin").setAttribute("aria-pressed", spin); };

// ------------------------------------------------------------------ overlay: title, north arrow, sources
function font(w, px) { return `${w} ${Math.round(px * u)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; }
function wrap(text, maxW) { const out = []; let cur = ""; for (const w of String(text).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (g2.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
function overlay() {
  g2.clearRect(0, 0, outW, outH); const pad = 40 * u;
  g2.fillStyle = "#3e8e35"; g2.font = font(800, 20); g2.fillText(view === "eye" ? "APPROXIMATE VIEW FROM THE CAMERA POSITION" : "SCENE", pad, pad + 16 * u);
  g2.fillStyle = "#1f2428"; g2.font = font(800, 46); const tl = wrap(D.title, outW - 2 * pad - 120 * u); tl.slice(0, 2).forEach((l, i) => g2.fillText(l, pad, pad + (68 + 52 * i) * u));
  g2.fillStyle = "#5b5f63"; g2.font = font(600, 22); g2.fillText([D.place, `${D.lat.toFixed(4)}, ${D.lon.toFixed(4)}`, `${Math.round(2 * R)} m across`].filter(Boolean).join("  ·  "), pad, pad + (68 + 52 * Math.min(2, tl.length) - 14) * u + 22 * u);
  // north arrow from the projected direction of north
  const o = new THREE.Vector3(0, 0, 0).project(cam), n = new THREE.Vector3(0, 0, -20).project(cam), ang = Math.atan2(-(n.y - o.y) * outH, (n.x - o.x) * outW);
  const cx = outW - pad - 34 * u, cy = pad + 40 * u; g2.save(); g2.translate(cx, cy); g2.rotate(-ang + Math.PI / 2 * 0); g2.rotate(Math.PI / 2 - ang - Math.PI / 2);
  g2.fillStyle = "rgba(255,255,255,.9)"; g2.beginPath(); g2.arc(0, 0, 30 * u, 0, 7); g2.fill(); g2.fillStyle = "#c2372b"; g2.beginPath(); g2.moveTo(22 * u, 0); g2.lineTo(-10 * u, -9 * u); g2.lineTo(-10 * u, 9 * u); g2.fill();
  g2.restore(); g2.fillStyle = "#1f2428"; g2.font = font(800, 18); g2.textAlign = "center"; g2.fillText("N", cx + Math.cos(-ang) * 0 , cy + 50 * u + 14 * u); g2.textAlign = "start";
  if (view === "eye") { g2.fillStyle = "rgba(31,36,40,.8)"; g2.font = font(600, 19); wrap("Buildings drawn from OpenStreetMap, heights from tags or estimated. Use this to compare outlines and positions with the footage, not as a photograph.", outW - 2 * pad).forEach((l, i) => g2.fillText(l, pad, outH - 80 * u + i * 24 * u)); }
  g2.font = font(500, 16); g2.fillStyle = "rgba(31,36,40,.75)";
  const src = `${D.source ? "Evidence: " + D.source + ". " : ""}Map data © OpenStreetMap contributors (ODbL)${D.osm_time ? ", " + D.osm_time.slice(0, 10) : ""}. Made with osint-visuals.`;
  wrap(src, outW - 2 * pad).slice(0, 2).reverse().forEach((l, i) => g2.fillText(l, pad, outH - 18 * u - i * 21 * u));
}

// ------------------------------------------------------------------ size, loop, export
function layout() { const W = innerWidth, H = innerHeight - 64, f = FMT[fmt]; let cw, ch;
  if (!f) { cw = W; ch = H; } else { const s = Math.min(W / f[0], H / f[1]); cw = Math.floor(f[0] * s); ch = Math.floor(f[1] * s); }
  $("stage").style.width = cw + "px"; $("stage").style.height = ch + "px";
  outW = f ? f[0] : Math.round(cw * devicePixelRatio); outH = f ? f[1] : Math.round(ch * devicePixelRatio); S = outW / cw; u = Math.min(outW, outH) / 1000;
  renderer.setPixelRatio(S); renderer.setSize(cw, ch, true); ov.width = outW; ov.height = outH; ov.style.width = cw + "px"; ov.style.height = ch + "px";
  fitCam(); }
function sizeLabels() {   // labels keep the same size on screen: about 34 px tall per 1000 px of frame
  const px = 0.034 * Math.min(outW, outH) / 1000 * 1000 / outH;   // fraction of the frame height
  labels.forEach(l => { const k = l.userData.h / 64, hf = px * k * (l.userData.big ? 1.25 : 1);
    if (cam.isPerspectiveCamera) { const h = hf * 2 * Math.tan(cam.fov * Math.PI / 360); l.scale.set(h * l.userData.w / l.userData.h, h, 1); }
    else { const h = hf * (ortho.top - ortho.bottom) / ortho.zoom; l.scale.set(h * l.userData.w / l.userData.h, h, 1); } }); }
let t0 = performance.now();
function loop(now) { const dt = (now - t0) / 1000; t0 = now;
  if (spin && view !== "eye") { const a = 0.35 * dt, p = ortho.position; ortho.position.set(p.x * Math.cos(a) - p.z * Math.sin(a), p.y, p.x * Math.sin(a) + p.z * Math.cos(a)); ortho.lookAt(controls.target); }
  if (evidence.userData.ring) { const k = (now / 1400) % 1; evidence.userData.ring.scale.setScalar(1 + k * 1.6); evidence.userData.ring.material.opacity = 1 - k; }
  controls.update(); sizeLabels(); if (cam.isPerspectiveCamera) labels.forEach(l => { const d = l.position.distanceTo(cam.position); l.scale.multiplyScalar(d); });
  renderer.render(scene, cam); overlay(); recording?.paint(); requestAnimationFrame(loop); }
const slug = () => (D.title || "scene").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
function save(blob, ext) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}-${view}.${ext}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function compose(c) { const x = c.getContext("2d"); x.drawImage(gl, 0, 0, outW, outH); x.drawImage(ov, 0, 0); return c; }
$("png").onclick = () => { const c = document.createElement("canvas"); c.width = outW; c.height = outH; compose(c).toBlob(b => save(b, "png")); };
$("rec").onclick = () => { if (recording || view === "eye") return; const c = document.createElement("canvas"); c.width = outW; c.height = outH;
  const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 }), parts = [], was = spin;
  rec.ondataavailable = e => parts.push(e.data); rec.onstop = () => { save(new Blob(parts, { type: "video/webm" }), "webm"); recording = null; spin = was; $("rec").textContent = "● Record orbit"; };
  recording = { paint: () => compose(c) }; spin = true; $("rec").textContent = "Recording…"; rec.start(); setTimeout(() => rec.stop(), 2 * Math.PI / 0.35 * 1000); };
$("fmt").onchange = e => { fmt = e.target.value; layout(); };
addEventListener("resize", layout);
const q = new URLSearchParams(location.search); if (q.get("fmt") && FMT[q.get("fmt")] !== undefined) { fmt = q.get("fmt"); $("fmt").value = fmt; }
layout(); setView(q.get("view") || "iso"); requestAnimationFrame(loop);
</script>
</body></html>
