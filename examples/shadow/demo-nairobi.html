  for (let h = 0; h < 24; h++) { const s = D.samples[h * 15]; if (!s || s[2] <= 0) continue; const [x, y] = polar(d, s[1], s[2]);
    el("circle", { cx: x, cy: y, r: 5 * u, fill: C.sun }); if (h % 2 === 0 || up.length < 60) txt(x + 10 * u, y - 8 * u, `${String(h).padStart(2, "0")}h`, 16 * u, 700, "#ffd9a8"); }
  // matching windows on the path, and the shadow arrow
  D.windows.forEach(w => { const seg = []; for (let m = w.from; m <= w.to; m += 2) { const [az, e] = sunAt(m); seg.push(polar(d, az, e)); }
    if (seg.length === 1) seg.push(seg[0]); el("polyline", { points: seg.map(p => p.join(",")).join(" "), fill: "none", stroke: C.fit, "stroke-width": 12 * u, "stroke-linecap": "round" });
    const mid = seg[Math.floor(seg.length / 2)]; txt(mid[0], mid[1] - 18 * u, `${hm(w.from)}–${hm(w.to)}`, 22 * u, 800, C.fit, "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" }); });
  if (D.shadow_az != null) arrow(d, D.shadow_az, d.r * 0.86, C.shadow, 6 * u, "shadow in the photo", u);
  if (D.claim && D.claim.sun_el > 0) { const [x, y] = polar(d, D.claim.sun_az, D.claim.sun_el); el("circle", { cx: x, cy: y, r: 11 * u, fill: "none", stroke: C.claim, "stroke-width": 4 * u });
    txt(x, y + 36 * u, `claimed ${hm(D.claim.minute)}`, 20 * u, 800, C.claim, "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" });
    arrow(d, D.claim.shadow_az, d.r * 0.62, C.claim, 4 * u, "", u, true); }
  if (tryMin >= 0) { const [az, e] = sunAt(tryMin); if (e > 0) { const [x, y] = polar(d, az, e); el("circle", { cx: x, cy: y, r: 13 * u, fill: "#fff" });
    arrow(d, (az + 180) % 360, d.r * Math.min(0.9, 0.25 + 0.6 / Math.max(0.2, Math.tan(e * Math.PI / 180)) * 0.3), "#ffffff", 3 * u, hm(tryMin), u, true); } }
  el("circle", { cx: d.cx, cy: d.cy, r: 7 * u, fill: "#fff" });
}
function arrow(d, az, len, col, w, label, u, dashed) { const a = (az - 90) * Math.PI / 180, x = d.cx + len * Math.cos(a), y = d.cy + len * Math.sin(a), hd = 18 * u;
  el("line", { x1: d.cx, y1: d.cy, x2: x, y2: y, stroke: col, "stroke-width": w, "stroke-dasharray": dashed ? `${10 * u} ${8 * u}` : "none", "stroke-linecap": "round" });
  el("path", { d: `M${x},${y} L${x - hd * Math.cos(a - .45)},${y - hd * Math.sin(a - .45)} L${x - hd * Math.cos(a + .45)},${y - hd * Math.sin(a + .45)} Z`, fill: col });
  if (label) txt(x + 12 * u * Math.cos(a), y + 12 * u * Math.sin(a) + 26 * u * (Math.sin(a) >= 0 ? 1 : -0.2), label, 18 * u, 700, col, Math.cos(a) < -0.3 ? "end" : Math.cos(a) > 0.3 ? "start" : "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" }); }
function drawChart(c, u) {
  const x = m => c.x + m / 1440 * c.w, maxE = Math.max(30, Math.ceil(D.noon_el / 15) * 15), y = e => c.y + c.h - Math.max(0, e) / maxE * c.h;
  txt(c.x, c.y - 18 * u, "Sun height through the day", 20 * u, 700, C.dim);
  el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, fill: "rgba(255,255,255,.03)", stroke: C.grid });
  D.windows.forEach(w => el("rect", { x: x(w.from), y: c.y, width: Math.max(3 * u, x(w.to) - x(w.from)), height: c.h, fill: "rgba(91,191,75,.3)" }));
  if (D.elev != null) el("rect", { x: c.x, y: y(D.elev + D.ratio_tolerance), width: c.w, height: Math.max(2, y(D.elev - D.ratio_tolerance) - y(D.elev + D.ratio_tolerance)), fill: "rgba(255,209,102,.15)" });
  el("polyline", { points: D.samples.map(s => `${x(s[0])},${y(s[2])}`).join(" "), fill: "none", stroke: C.sun, "stroke-width": 3 * u });
  for (let h = 0; h <= 24; h += 3) { txt(x(h * 60), c.y + c.h + 26 * u, `${String(h % 24).padStart(2, "0")}`, 16 * u, 600, C.dim, "middle"); el("line", { x1: x(h * 60), y1: c.y + c.h, x2: x(h * 60), y2: c.y + c.h + 6 * u, stroke: C.dim }); }
  [0, maxE / 2, maxE].forEach(e => txt(c.x - 8 * u, y(e) + 6 * u, `${e}°`, 15 * u, 600, C.dim, "end"));
  if (D.claim) { el("line", { x1: x(D.claim.minute), y1: c.y - 6 * u, x2: x(D.claim.minute), y2: c.y + c.h, stroke: C.claim, "stroke-width": 3 * u, "stroke-dasharray": `${6 * u} ${5 * u}` }); }
  if (D.sunrise != null) txt(x(D.sunrise), c.y + c.h - 8 * u, `↑ ${hm(D.sunrise)}`, 15 * u, 700, "#ffd9a8", "start");
  if (D.sunset != null) txt(x(D.sunset), c.y + c.h - 8 * u, `${hm(D.sunset)} ↓`, 15 * u, 700, "#ffd9a8", "end");
}
draw();
$("fmt").onchange = e => { fmt = e.target.value; draw(); };
$("time").oninput = e => { tryMin = +e.target.value; $("tl").textContent = `${hm(tryMin)} ${tzl}`; draw(); };
const slug = () => (D.title || "shadow").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
function save(blob, ext) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("svgb").onclick = () => save(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }), "svg");
$("png").onclick = () => { const [W, H] = FMT[fmt], img = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
  img.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(img, 0, 0, W, H); c.toBlob(b => save(b, "png")); URL.revokeObjectURL(url); }; img.src = url; };
const q = new URLSearchParams(location.search); if (q.get("fmt") && FMT[q.get("fmt")]) { fmt = q.get("fmt"); $("fmt").value = fmt; draw(); }
</script>
