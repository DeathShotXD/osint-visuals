<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · ATT&CK coverage</title>
<!-- Written by osint-visuals attack-coverage (attack.py). One self-contained page: the matrix is drawn as SVG from
     the counts you supplied. No network, no library. Technique IDs and names belong to MITRE ATT&CK. -->
<style>
  :root { --bg:#0b0f13; --panel:#121820; --ink:#eef2f0; --dim:#9aa7b0; --line:#23303a; --accent:#4fd1c5; --warm:#f2a65a; }
  [data-theme="light"] { --bg:#f6f3ec; --panel:#fffdf8; --ink:#1e2529; --dim:#63707a; --line:#ddd5c6; --accent:#0f766e; --warm:#b9770e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding:22px 22px 40px; }
  header { max-width:1600px; margin:0 auto 12px; }
  .kicker { font:800 11px/1 ui-monospace, monospace; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  h1 { font-size:clamp(22px, 2.4vw, 34px); margin:.25em 0 0; letter-spacing:-.01em; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:12px auto; max-width:1600px;
         padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .bar span.hint { color:var(--dim); font-size:12px; }
  .bar button { font:600 12px system-ui, sans-serif; color:var(--ink); background:var(--bg);
         border:1px solid var(--line); border-radius:7px; padding:7px 10px; cursor:pointer; }
  .bar button:hover { border-color:var(--accent); }
  .bar .sp { flex:1; }
  main { max-width:1600px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; }
  #chart { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; overflow:auto; }
  #chart svg { display:block; width:100%; height:auto; }
  #side { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:220px; }
  #side h2 { font-size:15px; margin:0 0 6px; }
  #side .meta { color:var(--dim); font-size:12px; margin-bottom:8px; }
  #side .desc { font-size:13px; margin:8px 0; white-space:pre-wrap; }
  #side .tag { display:inline-block; font:600 11px ui-monospace, monospace; color:var(--dim);
         border:1px solid var(--line); border-radius:5px; padding:2px 6px; margin:0 4px 4px 0; }
  #side .hint { color:var(--dim); font-size:12px; }
  #table { display:none; max-width:1600px; margin:12px auto 0; max-height:70vh; overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  table th, table td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  table th { color:var(--dim); font-weight:700; position:sticky; top:0; background:var(--panel); }
  footer { max-width:1600px; margin:12px auto 0; color:var(--dim); font-size:11px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } #side { min-height:0; } }
</style></head>
<body>
<header>
  <div class="kicker">ATT&amp;CK coverage / MITRE</div>
  <h1 class="sr-only">__TITLE__</h1>
  <div class="sr-only" id="sub"></div>
</header>

<div class="bar">
  <span class="hint" id="summary"></span>
  <span class="sp"></span>
  <button id="tableBtn">Table view</button>
  <button id="png">PNG</button>
  <button id="svgb">SVG</button>
</div>

<main>
  <div id="chart"></div>
  <aside id="side"><h2>Details</h2><div class="hint">Select a technique. Counts, sources and notes stay visible.</div></aside>
</main>

<div id="table"></div>
<footer id="foot"></footer>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const W = 1600, M = 40, HEAD = 54, CELL = 54, GAP = 8;
document.documentElement.dataset.theme = D.theme || "dark";
$("sub").textContent = D.subtitle || "";
const maxRows = Math.max(...D.tactics.map(t => t.techniques.length));
const H = HEAD + 96 + maxRows * (CELL + GAP) + 110;
const colW = (W - M * 2 - GAP * (D.tactics.length - 1)) / Math.max(1, D.tactics.length);
$("summary").textContent = `${D.technique_count} techniques, ${D.tactics.length} tactics, total ${D.total}` +
  (D.source ? ` - ${D.source}` : " - source not stated");
$("foot").textContent = `Technique IDs and names: MITRE ATT&CK. Counts and mappings: ${D.source || "the input"}. ` +
  `Generated ${D.generated} from ${D.input}. Coverage counts are not proof of detection or of capability. Made with osint-visuals.`;

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("role", "img");
svg.setAttribute("aria-label", D.title);

function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

function ratio(c) { return D.max > 0 ? Math.max(0, Math.min(1, c / D.max)) : 0; }
function short(s, n) { return s.length > n ? s.slice(0, n - 1) + "..." : s; }
function wrap(s, max) {
  const words = s.split(/\s+/), lines = [];
  let cur = "";
  for (const w of words) {
    if (!cur) cur = w;
    else if ((cur + " " + w).length <= max) cur += " " + w;
    else { lines.push(cur); cur = w; }
    if (lines.length === 2) break;
  }
  if (cur && lines.length < 2) lines.push(cur);
  return lines.length ? lines : [s];
}

function draw() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "var(--panel)" });
  el("text", { x: M, y: 42, fill: "var(--ink)", "font-size": 26, "font-weight": 800, "font-family": "system-ui, sans-serif" }, svg, D.title);
  if (D.subtitle) el("text", { x: M, y: 66, fill: "var(--dim)", "font-size": 13, "font-family": "system-ui, sans-serif" }, svg, D.subtitle);
  el("text", { x: M, y: 86, fill: "var(--dim)", "font-size": 11.5, "font-family": "ui-monospace, monospace" }, svg,
     `${D.technique_count} techniques, ${D.tactics.length} tactics, total ${D.total}` + (D.source ? ` - ${D.source}` : ""));

  D.tactics.forEach((t, i) => {
    const x = M + i * (colW + GAP);
    el("rect", { x, y: 104, width: colW, height: HEAD, rx: 7, fill: "var(--bg)", stroke: "var(--line)" });
    el("text", { x: x + 10, y: 126, fill: "var(--ink)", "font-size": 12.5, "font-weight": 800, "font-family": "system-ui, sans-serif" }, svg, short(t.label, Math.max(10, Math.floor(colW / 7))));
    el("text", { x: x + 10, y: 144, fill: "var(--dim)", "font-size": 10, "font-family": "ui-monospace, monospace" }, svg, `${t.techniques.length}`);

    t.techniques.forEach((c, j) => {
      const y = 104 + HEAD + GAP + j * (CELL + GAP);
      const r = ratio(float(c.count));
      const g = el("g", { tabindex: 0, role: "button", "aria-label": `${c.id} ${c.name}, count ${c.count}` });
      el("rect", { x, y, width: colW, height: CELL, rx: 7, fill: "var(--accent)", "fill-opacity": (0.10 + r * 0.42).toFixed(3),
                   stroke: "var(--accent)", "stroke-opacity": (0.25 + r * 0.55).toFixed(3) }, g);
      el("text", { x: x + 9, y: y + 19, fill: "var(--ink)", "font-size": 11.5, "font-weight": 800, "font-family": "ui-monospace, monospace" }, g, c.id || "");
      const nameLines = wrap(c.name, Math.max(8, Math.floor(colW / 5.6)));
      nameLines.slice(0, 2).forEach((line, k) => {
        el("text", { x: x + 9, y: y + 34 + k * 13, fill: "var(--ink)", "font-size": 9.5, "font-family": "system-ui, sans-serif" }, g, line);
      });
      el("text", { x: x + colW - 9, y: y + 19, fill: r > .55 ? "var(--bg)" : "var(--warm)", "font-size": 12, "font-weight": 800,
                   "text-anchor": "end", "font-family": "ui-monospace, monospace" }, g, String(c.count));
      el("title", {}, g, `${c.id} ${c.name}\ncount ${c.count}${c.sources.length ? "\n" + c.sources.join("; ") : ""}`);
      g.onclick = () => select(c, t);
      g.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(c, t); } };
    });
  });

  // legend
  const ly = H - 64;
  el("text", { x: M, y: ly - 8, fill: "var(--dim)", "font-size": 11, "font-family": "ui-monospace, monospace" }, svg, "count");
  for (let i = 0; i < 24; i++) {
    const r = i / 23;
    el("rect", { x: M + 44 + i * 16, y: ly - 18, width: 16, height: 12, fill: "var(--accent)", "fill-opacity": (0.10 + r * 0.42).toFixed(3) });
  }
  el("text", { x: M + 44, y: ly + 8, fill: "var(--dim)", "font-size": 10, "font-family": "ui-monospace, monospace" }, svg, "0");
  el("text", { x: M + 44 + 24 * 16, y: ly + 8, fill: "var(--dim)", "font-size": 10, "text-anchor": "end", "font-family": "ui-monospace, monospace" }, svg, String(D.max));
  el("text", { x: W - M, y: ly + 8, fill: "var(--dim)", "font-size": 10, "text-anchor": "end", "font-family": "ui-monospace, monospace" }, svg,
     "Columns follow ATT&CK tactics; cells are the techniques in your input");
  $("chart").replaceChildren(svg);
  buildTable();
}

function float(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }

function select(c, t) {
  const side = $("side"); side.replaceChildren();
  const h = document.createElement("h2"); h.textContent = `${c.id ? c.id + " " : ""}${c.name}`; side.append(h);
  const m = document.createElement("div"); m.className = "meta"; m.textContent = `${t.label} - count ${c.count}`; side.append(m);
  if (c.notes && c.notes.length) {
    const p = document.createElement("div"); p.className = "desc"; p.textContent = c.notes.join("\n"); side.append(p);
  }
  for (const s of c.sources || []) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = s; side.append(tag); }
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "A count is whatever your input measured: incidents, detections, reports or sightings. It is not a capability rating.";
  side.append(hint);
}

function buildTable() {
  const t = document.createElement("table");
  const head = document.createElement("tr");
  for (const h of ["Tactic", "Technique ID", "Technique", "Count", "Source"]) {
    const th = document.createElement("th"); th.textContent = h; head.append(th);
  }
  t.append(head);
  for (const tac of D.tactics) for (const c of tac.techniques) {
    const tr = document.createElement("tr");
    for (const v of [tac.label, c.id, c.name, c.count, (c.sources || []).join("; ")]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    t.append(tr);
  }
  $("table").replaceChildren(t);
}

function slug() { return (D.title || "attack-coverage").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48); }
function save(blob, ext) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function svgString() {
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", NS); clone.setAttribute("width", W); clone.setAttribute("height", H);
  return new XMLSerializer().serializeToString(clone);
}
$("svgb").onclick = () => save(new Blob([svgString()], { type: "image/svg+xml" }), "svg");
$("png").onclick = () => {
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svgString()], { type: "image/svg+xml" }));
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim() || "#121820";
    g.fillStyle = bg; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0);
    URL.revokeObjectURL(url); c.toBlob(b => save(b, "png"));
  };
  img.src = url;
};
$("tableBtn").onclick = () => { const t = $("table"); t.style.display = t.style.display === "block" ? "none" : "block"; };

draw();
</script>
</body></html>
