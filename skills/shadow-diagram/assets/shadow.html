<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · shadow diagram</title>
<!-- Written by osint-visuals shadow-diagram (shadow.py). Self-contained: the sun positions were computed by the script
     (NOAA solar position equations) and are embedded below; nothing is fetched. The graphic is one SVG, so PNG export
     keeps every label and the method note. -->
<style>
  :root { --bg:#0b0e11; --panel:#12171c; --ink:#eef2f0; --dim:#9aa7a2; --line:#26313a; --accent:#5bbf4b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { position:absolute; inset:0 0 64px 0; display:grid; place-items:center; padding:12px; }
  svg { max-width:100%; max-height:100%; height:auto; box-shadow:0 0 0 1px var(--line); }
  #ui { position:absolute; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--panel); border-top:1px solid var(--line); }
  #ui button, #ui select { font:600 13px system-ui, sans-serif; color:var(--ink); background:#1b232a; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  #ui button:hover, #ui select:hover { border-color:var(--accent); } #ui button:focus-visible, #ui select:focus-visible, #ui input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #time { flex:1; accent-color:#9aa7a2; min-width:60px; } #tl { font:600 13px ui-monospace, monospace; color:var(--dim); white-space:nowrap; }
  @media (max-width:560px) { #tl { display:none; } #ui { gap:6px; padding:0 8px; } }
</style></head>
<body>
<div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ui">
  <label for="time" style="color:var(--dim);font-weight:600">Try a time</label><input id="time" type="range" min="0" max="1439" value="-1"><span id="tl">off</span>
  <select id="fmt" aria-label="Frame"><option value="4:5">4:5 · 1080</option><option value="1:1">1:1 · 1080</option><option value="16:9">16:9 · 1920</option><option value="9:16">9:16 · Reel</option></select>
  <button id="png">PNG</button><button id="svgb">SVG</button>
</div>
<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
const FMT = { "4:5": [1080, 1350], "1:1": [1080, 1080], "16:9": [1920, 1080], "9:16": [1080, 1920] };
const C = { fit: "#5bbf4b", shadow: "#ffd166", claim: "#ff5c5c", sun: "#ffb347", grid: "rgba(255,255,255,.12)", text: "#eef2f0", dim: "#9aa7a2" };
const hm = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(Math.round(m % 60)).padStart(2, "0")}`;
const DIRS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const dir = az => DIRS[Math.round(((az % 360) + 360) % 360 / 22.5) % 16];
const tzl = D.utc_offset === 0 ? "UTC" : `UTC${D.utc_offset > 0 ? "+" : "−"}${hm(Math.abs(D.utc_offset) * 60)}`;
let fmt = "4:5", tryMin = -1, svg = $("svg");

function el(tag, attrs = {}, parent = svg, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; }
function txt(x, y, s, size, weight = 500, fill = C.text, anchor = "start", extra = {}) {
  return el("text", { x, y, "font-size": size, "font-weight": weight, fill, "text-anchor": anchor, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, sans-serif", ...extra }, svg, s); }
function wrapText(s, size, maxW) { const ctx = wrapText.c || (wrapText.c = document.createElement("canvas").getContext("2d")); ctx.font = `700 ${size}px system-ui, sans-serif`;
  const out = []; let cur = ""; for (const w of String(s).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
function sunAt(min) { const S = D.samples, i = Math.max(0, Math.min(S.length - 2, Math.floor(min / 4))), a = S[i], b = S[i + 1], k = (min - a[0]) / 4;
  let daz = b[1] - a[1]; if (daz > 180) daz -= 360; if (daz < -180) daz += 360; return [(a[1] + daz * k + 360) % 360, a[2] + (b[2] - a[2]) * k]; }

function draw() {
  const [W, H] = FMT[fmt], wide = W > H, u = Math.min(W, H) / 1080; svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const defs = el("defs"); const rg = el("radialGradient", { id: "bgG", cx: "30%", cy: "20%", r: "90%" }, defs);
  el("stop", { offset: "0", "stop-color": "#16202a" }, rg); el("stop", { offset: "1", "stop-color": "#0b0e11" }, rg);
  el("rect", { width: W, height: H, fill: "url(#bgG)" });
  const pad = 60 * u;
  // header
  txt(pad, pad + 20 * u, "CHRONOLOCATION", 22 * u, 800, C.fit, "start", { "letter-spacing": 3 * u });
  const tl = wrapText(D.title, 52 * u, (wide ? W * 0.55 : W) - 2 * pad); tl.slice(0, 3).forEach((l, i) => txt(pad, pad + (82 + 60 * i) * u, l, 52 * u, 800));
  let y = pad + (82 + 60 * Math.min(3, tl.length)) * u - 8 * u;
  txt(pad, y, [D.place, `${D.lat.toFixed(4)}, ${D.lon.toFixed(4)}`, `${D.date} · ${tzl}`].filter(Boolean).join("  ·  "), 24 * u, 500, C.dim);
  // the verdict first, so the dial gets whatever space is left
  const lines = [];
  if (D.windows.length) lines.push([`Fits ${D.windows.map(w => `${hm(w.from)}–${hm(w.to)}`).join(" or ")} local (${tzl})`, C.fit, 38]);
  else lines.push(["No time on this date fits", C.claim, 38]);
  const meas = []; if (D.shadow_az != null) meas.push(`shadow pointing ${Math.round(D.shadow_az)}° (${dir(D.shadow_az)}) ± ${D.tolerance}°`);
  if (D.elev != null) meas.push(`height-to-shadow ${D.height}:${D.shadow_length}, so the sun was ${D.elev.toFixed(1)}° high ± ${D.ratio_tolerance}°`);
  lines.push([`Measured: ${meas.join("; ")}`, C.dim, 22]);
  if (D.claim) { const c = D.claim; lines.push([c.fits ? `Claimed ${hm(c.minute)}: consistent with the shadow` : `Claimed ${hm(c.minute)}: does not fit`, c.fits ? C.fit : C.claim, 30]);
    lines.push([c.sun_el > 0 ? `At ${hm(c.minute)} the sun is in the ${dir(c.sun_az)} at ${Math.round(c.sun_el)}°, so shadows point ${Math.round(c.shadow_az)}° (${dir(c.shadow_az)})${c.off_by != null ? `, ${Math.round(c.off_by)}° away from the shadow in the photo` : ""}.` : `At ${hm(c.minute)} the sun is below the horizon.`, C.dim, 22]); }
  const foot = [`Sun position: NOAA solar equations, no refraction correction; assumes a vertical object on level ground. A fit is consistent with a time; it is not proof.`,
    `Image: ${D.source || "source not stated"}. Made with osint-visuals.`];
  const rw = wide ? W * 0.4 : W - 2 * pad, wrapped = lines.map(([s, col, size]) => [wrapText(s, size * u, rw), col, size]);
  const resultH = wrapped.reduce((h, [ls, , size]) => h + ls.length * size * u * 1.3 + 6 * u, 0);
  const footL = foot.flatMap(f => wrapText(f, 18 * u, W - 2 * pad)), footH = footL.length * 24 * u + 10 * u;
  // layout
  let dial, chart, rx, ry;
  if (wide) { dial = { cx: W * 0.27, cy: (y + H - footH) / 2 + 20 * u, r: Math.min(W * 0.19, (H - y - footH) * 0.36) };
    chart = { x: W * 0.55, y: y + 90 * u, w: W * 0.4, h: H * 0.2 }; rx = W * 0.55; ry = chart.y + chart.h + 90 * u; }
  else { const chartH = H * (fmt === "9:16" ? 0.12 : 0.11), free = H - footH - pad - resultH - chartH - (y + 60 * u) - 150 * u;
    const r = Math.max(120 * u, Math.min(W * 0.33, free / 2 - 30 * u)); dial = { cx: W / 2, cy: y + 70 * u + r, r };
    chart = { x: pad + 40 * u, y: dial.cy + r + 80 * u, w: W - 2 * pad - 40 * u, h: chartH }; rx = pad; ry = chart.y + chart.h + 80 * u; }
  drawDial(dial, u); drawChart(chart, u);
  let yy = ry; wrapped.forEach(([ls, col, size]) => { ls.forEach(l => { txt(rx, yy, l, size * u, size > 26 ? 800 : 500, col); yy += size * u * 1.3; }); yy += 6 * u; });
  let fy = H - pad + 16 * u - (footL.length - 1) * 24 * u; footL.forEach(l => { txt(pad, fy, l, 18 * u, 500, "rgba(220,228,225,.7)"); fy += 24 * u; });
}
function polar(d, az, elv) { const rr = d.r * (90 - Math.max(0, elv)) / 90, a = (az - 90) * Math.PI / 180; return [d.cx + rr * Math.cos(a), d.cy + rr * Math.sin(a)]; }
function drawDial(d, u) {
  el("circle", { cx: d.cx, cy: d.cy, r: d.r, fill: "rgba(255,255,255,.03)", stroke: "rgba(255,255,255,.35)", "stroke-width": 2 * u });
  [30, 60].forEach(e => { el("circle", { cx: d.cx, cy: d.cy, r: d.r * (90 - e) / 90, fill: "none", stroke: C.grid, "stroke-width": 1.5 * u, "stroke-dasharray": `${4 * u} ${6 * u}` });
    txt(d.cx + 6 * u, d.cy - d.r * (90 - e) / 90 - 6 * u, `${e}°`, 16 * u, 600, C.dim); });
  for (let a = 0; a < 360; a += 30) { const [x, y] = polar(d, a, 0); el("line", { x1: d.cx, y1: d.cy, x2: x, y2: y, stroke: C.grid, "stroke-width": 1 * u });
    const [lx, ly] = [d.cx + (d.r + 30 * u) * Math.cos((a - 90) * Math.PI / 180), d.cy + (d.r + 30 * u) * Math.sin((a - 90) * Math.PI / 180)];
    const card = { 0: "N", 90: "E", 180: "S", 270: "W" }[a]; txt(lx, ly + 8 * u, card || `${a}°`, (card ? 28 : 16) * u, card ? 800 : 500, card ? C.text : C.dim, "middle"); }
  // tolerance wedge and the measured shadow
  if (D.shadow_az != null) { const r = d.r * 0.92, a0 = (D.shadow_az - D.tolerance - 90) * Math.PI / 180, a1 = (D.shadow_az + D.tolerance - 90) * Math.PI / 180;
    el("path", { d: `M${d.cx},${d.cy} L${d.cx + r * Math.cos(a0)},${d.cy + r * Math.sin(a0)} A${r},${r} 0 0 1 ${d.cx + r * Math.cos(a1)},${d.cy + r * Math.sin(a1)} Z`, fill: "rgba(255,209,102,.16)", stroke: "rgba(255,209,102,.5)", "stroke-width": 1.5 * u }); }
  // sun path, hour ticks
  const up = D.samples.filter(s => s[2] > -0.5), pts = up.map(s => polar(d, s[1], s[2]));
  if (pts.length) el("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: C.sun, "stroke-width": 4 * u, "stroke-linecap": "round", "stroke-opacity": .85 });
  for (let h = 0; h < 24; h++) { const s = D.samples[h * 15]; if (!s || s[2] <= 0) continue; const [x, y] = polar(d, s[1], s[2]);
    el("circle", { cx: x, cy: y, r: 5 * u, fill: C.sun }); if (h % 2 === 0 || up.length < 60) txt(x + 10 * u, y - 8 * u, `${String(h).padStart(2, "0")}h`, 16 * u, 700, "#ffd9a8"); }
  // matching windows on the path, and the shadow arrow
  D.windows.forEach(w => { const seg = []; for (let m = w.from; m <= w.to; m += 2) { const [az, e] = sunAt(m); seg.push(polar(d, az, e)); }
    if (seg.length === 1) seg.push(seg[0]); el("polyline", { points: seg.map(p => p.join(",")).join(" "), fill: "none", stroke: C.fit, "stroke-width": 12 * u, "stroke-linecap": "round" });
    const mid = seg[Math.floor(seg.length / 2)]; txt(mid[0], mid[1] - 18 * u, `${hm(w.from)}–${hm(w.to)}`, 22 * u, 800, C.fit, "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" }); });
  if (D.shadow_az != null) arrow(d, D.shadow_az, d.r * 0.86, C.shadow, 6 * u, "shadow in the photo", u);
  if (D.claim && D.claim.sun_el > 0) { const [x, y] = polar(d, D.claim.sun_az, D.claim.sun_el); el("circle", { cx: x, cy: y, r: 11 * u, fill: "none", stroke: C.claim, "stroke-width": 4 * u });
    txt(x, y + 36 * u, `claimed ${hm(D.claim.minute)}`, 20 * u, 800, C.claim, "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" });
    arrow(d, D.claim.shadow_az, d.r * 0.62, C.claim, 4 * u, "", u, true); }
  if (tryMin >= 0) { const [az, e] = sunAt(tryMin); if (e > 0) { const [x, y] = polar(d, az, e); el("circle", { cx: x, cy: y, r: 13 * u, fill: "#fff" });
    arrow(d, (az + 180) % 360, d.r * Math.min(0.9, 0.25 + 0.6 / Math.max(0.2, Math.tan(e * Math.PI / 180)) * 0.3), "#ffffff", 3 * u, hm(tryMin), u, true); } }
  el("circle", { cx: d.cx, cy: d.cy, r: 7 * u, fill: "#fff" });
}
function arrow(d, az, len, col, w, label, u, dashed) { const a = (az - 90) * Math.PI / 180, x = d.cx + len * Math.cos(a), y = d.cy + len * Math.sin(a), hd = 18 * u;
  el("line", { x1: d.cx, y1: d.cy, x2: x, y2: y, stroke: col, "stroke-width": w, "stroke-dasharray": dashed ? `${10 * u} ${8 * u}` : "none", "stroke-linecap": "round" });
  el("path", { d: `M${x},${y} L${x - hd * Math.cos(a - .45)},${y - hd * Math.sin(a - .45)} L${x - hd * Math.cos(a + .45)},${y - hd * Math.sin(a + .45)} Z`, fill: col });
  if (label) txt(x + 12 * u * Math.cos(a), y + 12 * u * Math.sin(a) + 26 * u * (Math.sin(a) >= 0 ? 1 : -0.2), label, 18 * u, 700, col, Math.cos(a) < -0.3 ? "end" : Math.cos(a) > 0.3 ? "start" : "middle", { stroke: "#0b0e11", "stroke-width": 5 * u, "paint-order": "stroke" }); }
function drawChart(c, u) {
  const x = m => c.x + m / 1440 * c.w, maxE = Math.max(30, Math.ceil(D.noon_el / 15) * 15), y = e => c.y + c.h - Math.max(0, e) / maxE * c.h;
  txt(c.x, c.y - 18 * u, "Sun height through the day", 20 * u, 700, C.dim);
  el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, fill: "rgba(255,255,255,.03)", stroke: C.grid });
  D.windows.forEach(w => el("rect", { x: x(w.from), y: c.y, width: Math.max(3 * u, x(w.to) - x(w.from)), height: c.h, fill: "rgba(91,191,75,.3)" }));
  if (D.elev != null) el("rect", { x: c.x, y: y(D.elev + D.ratio_tolerance), width: c.w, height: Math.max(2, y(D.elev - D.ratio_tolerance) - y(D.elev + D.ratio_tolerance)), fill: "rgba(255,209,102,.15)" });
  el("polyline", { points: D.samples.map(s => `${x(s[0])},${y(s[2])}`).join(" "), fill: "none", stroke: C.sun, "stroke-width": 3 * u });
  for (let h = 0; h <= 24; h += 3) { txt(x(h * 60), c.y + c.h + 26 * u, `${String(h % 24).padStart(2, "0")}`, 16 * u, 600, C.dim, "middle"); el("line", { x1: x(h * 60), y1: c.y + c.h, x2: x(h * 60), y2: c.y + c.h + 6 * u, stroke: C.dim }); }
  [0, maxE / 2, maxE].forEach(e => txt(c.x - 8 * u, y(e) + 6 * u, `${e}°`, 15 * u, 600, C.dim, "end"));
  if (D.claim) { el("line", { x1: x(D.claim.minute), y1: c.y - 6 * u, x2: x(D.claim.minute), y2: c.y + c.h, stroke: C.claim, "stroke-width": 3 * u, "stroke-dasharray": `${6 * u} ${5 * u}` }); }
  if (D.sunrise != null) txt(x(D.sunrise), c.y + c.h - 8 * u, `↑ ${hm(D.sunrise)}`, 15 * u, 700, "#ffd9a8", "start");
  if (D.sunset != null) txt(x(D.sunset), c.y + c.h - 8 * u, `${hm(D.sunset)} ↓`, 15 * u, 700, "#ffd9a8", "end");
}
draw();
$("fmt").onchange = e => { fmt = e.target.value; draw(); };
$("time").oninput = e => { tryMin = +e.target.value; $("tl").textContent = `${hm(tryMin)} ${tzl}`; draw(); };
const slug = () => (D.title || "shadow").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
function save(blob, ext) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("svgb").onclick = () => save(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }), "svg");
$("png").onclick = () => { const [W, H] = FMT[fmt], img = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
  img.onload = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(img, 0, 0, W, H); c.toBlob(b => save(b, "png")); URL.revokeObjectURL(url); }; img.src = url; };
const q = new URLSearchParams(location.search); if (q.get("fmt") && FMT[q.get("fmt")]) { fmt = q.get("fmt"); $("fmt").value = fmt; draw(); }
</script>
</body></html>
