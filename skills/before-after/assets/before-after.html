<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · before and after</title>
<!-- Written by osint-visuals before-after (before_after.py). Both images are embedded below, so this page works offline.
     Everything is drawn on one canvas: what you see is what PNG and WebM export, dates and credits included. -->
<style>
  :root { --panel:#12171c; --ink:#eef2f0; --line:#26313a; --accent:#5bbf4b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0b0e11; color:var(--ink); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #wrap { position:absolute; inset:0 0 64px 0; display:grid; place-items:center; padding:10px; }
  canvas { max-width:100%; max-height:100%; cursor:ew-resize; touch-action:none; box-shadow:0 0 0 1px var(--line); }
  #ui { position:absolute; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--panel); border-top:1px solid var(--line); overflow-x:auto; }
  #ui button, #ui select { font:600 13px system-ui, sans-serif; color:var(--ink); background:#1b232a; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; white-space:nowrap; }
  #ui button:hover, #ui select:hover { border-color:var(--accent); } #ui button[aria-pressed="true"] { background:#24402a; border-color:var(--accent); }
  #ui button:focus-visible, #ui select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #ui .sp { flex:1; } #ui button.rec { border-color:#ff5252; color:#ffb3b3; }
</style></head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="Before and after comparison. Use the left and right arrow keys to move the divider."></canvas></div>
<div id="ui">
  <button data-mode="slider" aria-pressed="true">Slider</button><button data-mode="side" aria-pressed="false">Side by side</button><button data-mode="flicker" aria-pressed="false">Flicker</button><span class="sp"></span>
  <select id="fmt" aria-label="Frame"><option value="1:1">1:1 · 1080</option><option value="4:5">4:5 · 1080</option><option value="16:9">16:9 · 1920</option><option value="9:16">9:16 · Reel</option></select>
  <button id="png">PNG</button><button id="rec" class="rec">● Record sweep</button>
</div>
<script>
const D = /*__DATA__*/null, $ = id => document.getElementById(id), cv = $("c"), g = cv.getContext("2d");
const FMT = { "1:1": [1080, 1080], "4:5": [1080, 1350], "16:9": [1920, 1080], "9:16": [1080, 1920] };
let fmt = "1:1", mode = "slider", split = 0.5, W = 0, H = 0, u = 1, img = [], box = null, recording = null, flick = 0;
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const font = (w, px) => `${w} ${Math.round(px * u)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
function wrap(text, maxW) { const out = []; let cur = ""; for (const w of String(text).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
function pill(x, y, text, bg, fg, size, align = "left") { g.font = font(800, size); const w = g.measureText(text).width + 26 * u, h = size * u + 18 * u, bx = align === "right" ? x - w : x;
  g.fillStyle = bg; g.beginPath(); g.roundRect(bx, y, w, h, 8 * u); g.fill(); g.fillStyle = fg; g.fillText(text, bx + 13 * u, y + h - 13 * u); return w; }
function header() { const pad = 44 * u; g.fillStyle = "#0b0e11"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#5bbf4b"; g.font = font(800, 20); g.fillText("BEFORE AND AFTER", pad, pad + 14 * u);
  g.fillStyle = "#fff"; g.font = font(800, 44); const tl = wrap(D.title, W - 2 * pad); tl.slice(0, 2).forEach((l, i) => g.fillText(l, pad, pad + (64 + 50 * i) * u));
  let y = pad + (64 + 50 * Math.min(2, tl.length)) * u - 10 * u; if (D.subtitle) { g.fillStyle = "#c9d3cf"; g.font = font(500, 22); wrap(D.subtitle, W - 2 * pad).slice(0, 2).forEach(l => { y += 30 * u; g.fillText(l, pad, y); }); }
  return y + 28 * u; }
function footer() { const pad = 44 * u; g.font = font(500, 16); g.fillStyle = "rgba(220,228,225,.72)";
  const src = `${D.credit}${D.source ? " " + D.source : ""} Made with osint-visuals.`; const ls = wrap(src, W - 2 * pad).slice(0, 3);
  ls.forEach((l, i) => g.fillText(l, pad, H - 22 * u - (ls.length - 1 - i) * 21 * u)); return ls.length * 21 * u + 34 * u; }
function marks(x, y, w, h) { D.marks.forEach(m => { const px = x + m.x * w, py = y + m.y * h; if (px < x || px > x + w || py < y || py > y + h) return;
  g.strokeStyle = "#ffd54f"; g.lineWidth = 4 * u; g.beginPath(); g.arc(px, py, 26 * u, 0, 7); g.stroke();
  g.font = font(800, 22); const tw = g.measureText(m.t).width + 24 * u, right = px + 40 * u + tw < x + w, lx = right ? px + 36 * u : px - 36 * u - tw;
  g.beginPath(); g.moveTo(px + (right ? 26 : -26) * u, py); g.lineTo(right ? lx : lx + tw, py); g.stroke();
  g.fillStyle = "rgba(10,13,16,.85)"; g.beginPath(); g.roundRect(lx, py - 20 * u, tw, 40 * u, 8 * u); g.fill(); g.fillStyle = "#ffd54f"; g.fillText(m.t, lx + 12 * u, py + 8 * u); }); }
function cover(im, x, y, w, h) {   // draw an image filling the box, centred, cropping what doesn't fit
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; const k = Math.max(w / im.width, h / im.height), sw = w / k, sh = h / k; g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h); }
function draw() {
  if (img.length < 2) return; const top = header(), fh = footer(), pad = 44 * u;
  box = { x: pad, y: top, w: W - 2 * pad, h: H - top - fh - 10 * u }; const { x, y, w, h } = box;
  g.save(); g.beginPath(); g.roundRect(x, y, w, h, 14 * u); g.clip();
  if (mode === "side") { const half = (w - 10 * u) / 2; cover(img[0], x, y, half, h); cover(img[1], x + half + 10 * u, y, half, h);
    g.restore(); pill(x + 14 * u, y + 14 * u, D.labels[0], "rgba(10,13,16,.85)", "#fff", 22); pill(x + w - 14 * u, y + 14 * u, D.labels[1], "#d7352a", "#fff", 22, "right"); return; }
  if (mode === "flicker") { const k = Math.floor(flick) % 2; cover(img[k], x, y, w, h); marks(x, y, w, h); g.restore();
    pill(x + 14 * u, y + 14 * u, (k ? "AFTER · " : "BEFORE · ") + D.labels[k], k ? "#d7352a" : "rgba(10,13,16,.85)", "#fff", 24); return; }
  cover(img[1], x, y, w, h); const sx = x + w * split;
  g.save(); g.beginPath(); g.rect(x, y, sx - x, h); g.clip(); cover(img[0], x, y, w, h); g.restore();
  marks(x, y, w, h);
  g.fillStyle = "#fff"; g.fillRect(sx - 2 * u, y, 4 * u, h); g.beginPath(); g.arc(sx, y + h / 2, 28 * u, 0, 7); g.fill();
  g.fillStyle = "#0b0e11"; g.font = font(900, 26); g.textAlign = "center"; g.fillText("‹ ›", sx, y + h / 2 + 9 * u); g.textAlign = "start";
  g.restore();
  if (split > 0.08) pill(x + 14 * u, y + 14 * u, "BEFORE · " + D.labels[0], "rgba(10,13,16,.85)", "#fff", 22);
  if (split < 0.92) pill(x + w - 14 * u, y + 14 * u, "AFTER · " + D.labels[1], "#d7352a", "#fff", 22, "right");
  recording?.paint();
}
function layout() { [W, H] = FMT[fmt]; cv.width = W; cv.height = H; u = Math.min(W, H) / 1000; draw(); }
function setSplit(clientX) { const r = cv.getBoundingClientRect(), k = W / r.width, px = (clientX - r.left) * k; if (!box) return; split = Math.max(0, Math.min(1, (px - box.x) / box.w)); draw(); }
cv.addEventListener("pointerdown", e => { if (mode !== "slider") return; cv.setPointerCapture(e.pointerId); setSplit(e.clientX); });
cv.addEventListener("pointermove", e => { if (mode === "slider" && e.buttons) setSplit(e.clientX); });
cv.addEventListener("keydown", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { split = Math.max(0, Math.min(1, split + (e.key === "ArrowLeft" ? -0.05 : 0.05))); draw(); e.preventDefault(); } });
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
$("fmt").onchange = e => { fmt = e.target.value; layout(); };
let last = 0; (function tick(now) { if (mode === "flicker") { flick += (now - (last || now)) / 900; draw(); } last = now; requestAnimationFrame(tick); })(0);
const slug = () => (D.title || "before-after").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
function save(blob, ext) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$("png").onclick = () => cv.toBlob(b => save(b, "png"));
$("rec").onclick = () => {   // the divider sweeps across and back: a ready-made clip for social media
  if (recording) return; mode = "slider"; document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === "slider"));
  const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 10e6 }), parts = [], t0 = performance.now(), len = 7000;
  rec.ondataavailable = e => parts.push(e.data); rec.onstop = () => { save(new Blob(parts, { type: "video/webm" }), "webm"); recording = null; $("rec").textContent = "● Record sweep"; };
  recording = { paint: () => {} }; $("rec").textContent = "Recording…"; rec.start();
  (function step(now) { const k = (now - t0) / len; if (k >= 1) { split = 0.5; draw(); setTimeout(() => rec.stop(), 300); return; }
    split = 0.5 - 0.48 * Math.sin(k * Math.PI * 2); draw(); requestAnimationFrame(step); })(t0); };
const q = new URLSearchParams(location.search); if (q.get("fmt") && FMT[q.get("fmt")]) { fmt = q.get("fmt"); $("fmt").value = fmt; } if (q.get("split")) split = +q.get("split");
Promise.all(D.imgs.map(load)).then(r => { img = r; layout(); });
</script>
</body></html>
