<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · conflict events</title>
<!-- Written by osint-visuals conflict-events (conflict.py). One self-contained page: the event table, the country
     outlines and the aggregates are embedded below. No network at open time, no library, no key. -->
<style>
  :root { --bg:#0b0f13; --panel:#121820; --ink:#eef2f0; --dim:#9aa7b0; --line:#23303a; --accent:#4fd1c5;
          --t1:#f07178; --t2:#f2a65a; --t3:#9d8df1; --land:#26343f; --seaLight:#16333a; --landDark:#0e1a22; }
  [data-theme="light"] { --bg:#f6f3ec; --panel:#fffdf8; --ink:#1e2529; --dim:#63707a; --line:#ddd5c6;
          --land:#e7e0cf; --landDark:#f2eee2; --seaLight:#dfe8ea; --t1:#c0392b; --t2:#b9770e; --t3:#6c5ce7; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding:22px 22px 40px; }
  header { max-width:1600px; margin:0 auto 12px; }
  .kicker { font:800 11px/1 ui-monospace, monospace; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:12px auto; max-width:1600px;
         padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .bar label { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; cursor:pointer; }
  .swatch { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .bar button { font:600 12px system-ui, sans-serif; color:var(--ink); background:var(--bg);
         border:1px solid var(--line); border-radius:7px; padding:7px 10px; cursor:pointer; }
  .bar button:hover { border-color:var(--accent); }
  .bar .sp { flex:1; }
  main { max-width:1600px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; }
  #chart { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; overflow:auto; }
  #chart svg { display:block; width:100%; height:auto; }
  #side { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  #side h2 { font-size:14px; margin:0 0 8px; }
  #side table { width:100%; border-collapse:collapse; font-size:12px; }
  #side td { padding:4px 6px; border-bottom:1px solid var(--line); }
  #side td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  #side .hint { color:var(--dim); font-size:11.5px; margin-top:10px; }
  #side button { font:600 12px system-ui, sans-serif; color:var(--ink); background:var(--bg);
         border:1px solid var(--line); border-radius:7px; padding:7px 10px; cursor:pointer; margin-top:10px; }
  #table { display:none; max-width:1600px; margin:12px auto 0; max-height:60vh; overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  table.big { width:100%; border-collapse:collapse; font-size:12px; }
  table.big th, table.big td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  table.big th { color:var(--dim); position:sticky; top:0; background:var(--panel); }
  footer { max-width:1600px; margin:12px auto 0; color:var(--dim); font-size:11px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
</style></head>
<body>
<header>
  <div class="kicker">Conflict events / aggregate view</div>
  <h1 class="sr-only">__TITLE__</h1>
</header>

<div class="bar" id="filters"></div>

<main>
  <div id="chart"></div>
  <aside id="side"></aside>
</main>

<div id="table"></div>
<footer id="foot"></footer>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const COL = { "1":"var(--t1)", "2":"var(--t2)", "3":"var(--t3)" };
const W = 1600, H = 940, PAD = 40, MAPH = 520, CH = 190;
document.documentElement.dataset.theme = D.theme || "dark";
const active = new Set(D.types.map(t => t.key));

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("role", "img");
svg.setAttribute("aria-label", D.title);
function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
function num(n) { return n.toLocaleString("en"); }
function colour(t) { return COL[t] || "var(--accent)"; }

// ------------------------------------------------------------------ filters
(function buildFilters() {
  $("filters").append(Object.assign(document.createElement("span"), {
    className: "hint", style: "color:var(--dim);font-size:12px",
    textContent: `${num(D.total_events)} events, ${num(D.total_deaths)} reported deaths` +
      (D.range ? `, ${D.range[0]} to ${D.range[1]}` : "") }));

  for (const t of D.types) {
    const label = document.createElement("label");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
    cb.onchange = () => { cb.checked ? active.add(t.key) : active.delete(t.key); draw(); };
    const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = colour(t.key);
    label.append(cb, sw, document.createTextNode(`${t.label} (${num(t.events)})`));
    $("filters").append(label);
  }
  const size = document.createElement("label");
  size.innerHTML = '<input id="byd" type="checkbox"> size by reported deaths';
  $("filters").append(size);
  $("byd").onchange = draw;
  const sp = document.createElement("span"); sp.className = "sp"; $("filters").append(sp);
  const tb = document.createElement("button"); tb.textContent = "Table view";
  tb.onclick = () => { const t = $("table"); t.style.display = t.style.display === "block" ? "none" : "block"; };
  const png = document.createElement("button"); png.textContent = "PNG";
  const sv = document.createElement("button"); sv.textContent = "SVG";
  $("filters").append(tb, png, sv);
  png.onclick = () => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgString()], { type: "image/svg+xml" }));
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const g = c.getContext("2d");
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--panel").trim() || "#121820";
      g.fillStyle = bg; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0);
      URL.revokeObjectURL(url); c.toBlob(b => save(b, "png"));
    };
    img.src = url;
  };
  sv.onclick = () => save(new Blob([svgString()], { type: "image/svg+xml" }), "svg");
})();

function slug() { return (D.title || "conflict").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48); }
function save(blob, ext) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${slug()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function svgString() {
  const c = svg.cloneNode(true);
  c.setAttribute("xmlns", NS); c.setAttribute("width", W); c.setAttribute("height", H);
  return new XMLSerializer().serializeToString(c);
}

// ------------------------------------------------------------------ map and chart
function draw() {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const evs = D.events.filter(e => active.has(e.type) || (!e.type && active.size));
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "var(--panel)" });
  el("text", { x: PAD, y: 44, fill: "var(--ink)", "font-size": 26, "font-weight": 800, "font-family": "system-ui, sans-serif" }, svg, D.title);
  if (D.subtitle) el("text", { x: PAD, y: 68, fill: "var(--dim)", "font-size": 13 }, svg, D.subtitle);
  el("text", { x: PAD, y: 90, fill: "var(--dim)", "font-size": 11.5, "font-family": "ui-monospace, monospace" }, svg,
     `${num(evs.length)} of ${num(D.total_events)} events shown` + (D.source ? ` - source: ${D.source}` : " - source not stated"));

  // map frame
  const box = D.bbox || [-180, -60, 180, 70];
  const spanx = Math.max(0.5, box[2] - box[0]), spany = Math.max(0.5, box[3] - box[1]);
  const mx = [box[0] - spanx * 0.45, box[1] - spany * 0.45, box[2] + spanx * 0.45, box[3] + spany * 0.45];
  const x = lon => PAD + (lon - mx[0]) / (mx[2] - mx[0]) * (W - 2 * PAD);
  const y = lat => 120 + (mx[3] - lat) / (mx[3] - mx[1]) * (MAPH - 40);
  el("rect", { x: PAD, y: 116, width: W - 2 * PAD, height: MAPH - 40, fill: "var(--landDark)", stroke: "var(--line)" });
  for (let lon = Math.ceil(mx[0]); lon < mx[2]; lon++) el("line", { x1: x(lon), y1: 116, x2: x(lon), y2: 116 + MAPH - 40, stroke: "var(--line)", "stroke-opacity": .5 });
  for (let lat = Math.ceil(mx[1]); lat < mx[3]; lat++) el("line", { x1: PAD, y1: y(lat), x2: W - PAD, y2: y(lat), stroke: "var(--line)", "stroke-opacity": .5 });
  const defs = el("defs", {});
  const clip = el("clipPath", { id: "mapclip" }, defs);
  el("rect", { x: PAD, y: 116, width: W - 2 * PAD, height: MAPH - 40 }, clip);
  const mapG = el("g", { "clip-path": "url(#mapclip)" });
  (D.basemap || []).forEach(polys => polys.forEach(ring => {
    if (ring.length < 3) return;
    const rlons = ring.map(p => p[0]), rlats = ring.map(p => p[1]);
    if (Math.max(...rlons) < mx[0] || Math.min(...rlons) > mx[2] ||
        Math.max(...rlats) < mx[1] || Math.min(...rlats) > mx[3]) return;   // off the map
    el("polygon", { points: ring.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" "),
                    fill: "var(--land)", stroke: "var(--line)", "stroke-width": .9 }, mapG);
  }));
  const byDeaths = $("byd") && $("byd").checked;
  const maxD = Math.max(1, ...evs.map(e => e.deaths));
  evs.forEach(e => {
    const r = byDeaths ? 2.5 + Math.sqrt(e.deaths / maxD) * 9 : 3.2;
    const g = el("g", { tabindex: 0, role: "listitem", "aria-label": `${e.month}, ${e.deaths} reported deaths` });
    el("circle", { cx: x(e.lon), cy: y(e.lat), r, fill: colour(e.type), "fill-opacity": .55, "stroke-width": 0 }, g);
    el("title", {}, g, `${e.month}${e.country ? " - " + e.country : ""}\n${num(e.deaths)} reported deaths` +
       (e.type ? `\n${D.types.find(t => t.key === e.type) ? D.types.find(t => t.key === e.type).label : e.type}` : "") +
       (e.source ? `\n${e.source.slice(0, 120)}` : ""));
    g.onclick = () => detail(e);
  });
  el("text", { x: PAD, y: 112, fill: "var(--dim)", "font-size": 10, "font-family": "ui-monospace, monospace" }, svg,
     byDeaths ? "point size: reported deaths" : "points are events, not targets");

  // monthly chart
  const cy0 = 120 + MAPH, cy1 = cy0 + CH, months = D.monthly;
  const maxE = Math.max(1, ...months.map(m => m.events));
  const bw = (W - 2 * PAD) / Math.max(1, months.length);
  el("text", { x: PAD, y: cy0 - 8, fill: "var(--ink)", "font-size": 13, "font-weight": 700 }, svg, "Events per month");
  months.forEach((m, i) => {
    const h = m.events / maxE * CH;
    el("rect", { x: PAD + i * bw + bw * .12, y: cy1 - h, width: Math.max(1, bw * .76), height: h, fill: "var(--accent)", opacity: .65 });
    if (i % Math.ceil(months.length / 14) === 0)
      el("text", { x: PAD + i * bw + bw / 2, y: cy1 + 16, fill: "var(--dim)", "font-size": 9.5, "text-anchor": "middle",
                   "font-family": "ui-monospace, monospace" }, svg, m.month.slice(2));
  });
  el("line", { x1: PAD, y1: cy1 + 2, x2: W - PAD, y2: cy1 + 2, stroke: "var(--line)" });

  // side summary
  const side = $("side"); side.replaceChildren();
  const h = document.createElement("h2"); h.textContent = "Summary"; side.append(h);
  const t = document.createElement("table");
  const rows = [["Events", num(D.total_events)], ["Reported deaths", num(D.total_deaths)]];
  if (D.total_high) rows.push(["High estimate", num(D.total_high)]);
  if (D.total_civilians) rows.push(["Civilians killed", num(D.total_civilians)]);
  if (D.range) rows.push(["Period", `${D.range[0]} to ${D.range[1]}`]);
  for (const [k, v] of rows) { const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = k;
    const b = document.createElement("td"); b.textContent = v; tr.append(a, b); t.append(tr); }
  side.append(t);
  if (D.countries.length) {
    const h2 = document.createElement("h2"); h2.style.marginTop = "12px"; h2.textContent = "By country"; side.append(h2);
    const t2 = document.createElement("table");
    for (const c of D.countries) { const tr = document.createElement("tr"); const a = document.createElement("td"); a.textContent = c.country;
      const b = document.createElement("td"); b.textContent = num(c.events); tr.append(a, b); t2.append(tr); }
    side.append(t2);
  }
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "Reported events, aggregated. Reporting is uneven across places and dates, and a report is not a verified fact. No individual or victim is identified.";
  side.append(hint);

  $("chart").replaceChildren(svg);
  buildTable();
}

function detail(e) {
  const side = $("side"); side.replaceChildren();
  const h = document.createElement("h2"); h.textContent = e.month; side.append(h);
  const p = document.createElement("div"); p.style.fontSize = "12.5px";
  p.textContent = `${num(e.deaths)} reported deaths` + (e.country ? ` - ${e.country}` : "") +
    (e.type ? ` - ${D.types.find(t => t.key === e.type) ? D.types.find(t => t.key === e.type).label : e.type}` : "");
  const s = document.createElement("div"); s.className = "hint"; s.textContent = e.source || "No source line in the row.";
  const back = document.createElement("button"); back.textContent = "Back to summary";
  back.onclick = draw;
  side.append(p, s, back);
}

function buildTable() {
  const t = document.createElement("table"); t.className = "big";
  const head = document.createElement("tr");
  for (const h of ["Month", "Latitude", "Longitude", "Reported deaths", "Type", "Country", "Source"]) {
    const th = document.createElement("th"); th.textContent = h; head.append(th);
  }
  t.append(head);
  for (const e of D.events.slice(0, 2000)) {
    const tr = document.createElement("tr");
    for (const v of [e.month, e.lat, e.lon, e.deaths, e.type, e.country, (e.source || "").slice(0, 100)]) {
      const td = document.createElement("td"); td.textContent = v; tr.append(td);
    }
    t.append(tr);
  }
  $("table").replaceChildren(t);
}

$("foot").textContent = `${D.source ? "Source: " + D.source + ". " : "Source not stated. "}` +
  `Generated ${D.generated} from ${D.input}. Event tables record reports, not verified facts; check definitions, ` +
  `coverage and double counting before publishing. No victim names. Made with osint-visuals.`;
draw();
</script>
</body></html>
